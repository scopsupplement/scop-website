[build]
  # Rebuilds articles-index.json from _articles/*.md on every deploy (incl. CMS publishes),
  # then writes crawlable HTML for every article, the FAQ page and sitemap.xml
  command = "node scripts/build-articles-index.js && node scripts/build-static-pages.js"
  publish = "."
  functions = "netlify/functions"

# Enable Netlify Identity and Git Gateway for Decap CMS
[[plugins]]
  package = "@netlify/plugin-lighthouse"

[build.environment]
  NODE_VERSION = "20"

# v37: subscriber 8 week plan. Reachable by link, kept out of search results
[[headers]]
  for = "/plan/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=3600"
