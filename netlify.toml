[build]
  # Rebuilds articles-index.json from _articles/*.md on every deploy (incl. CMS publishes)
  command = "node scripts/build-articles-index.js"
  publish = "."
  functions = "netlify/functions"

# Enable Netlify Identity and Git Gateway for Decap CMS
[[plugins]]
  package = "@netlify/plugin-lighthouse"

[build.environment]
  NODE_VERSION = "18"
