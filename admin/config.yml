backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articles"
    label: "Education Articles"
    folder: "_articles"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Nutrition & Supplementation", value: "nutrition" }
          - { label: "Movement & Recovery", value: "movement" }
          - { label: "Sleep & Restoration", value: "sleep" }
          - { label: "Stress & Resilience", value: "stress" }

      - label: "Read Time (minutes)"
        name: "read_time"
        widget: "number"
        required: false
        hint: "Leave blank to estimate automatically from the article length."
        default: 5
        value_type: "int"
        min: 1

      - label: "Search title (optional)"
        name: "seo_title"
        widget: "string"
        required: false
        hint: "Shorter title for Google and Bing, under 60 characters. Leave blank to use the main title."

      - label: "Search description (optional)"
        name: "seo_description"
        widget: "text"
        required: false
        hint: "Shown under the link in search results, 120 to 155 characters. Leave blank to use the summary."
        max: 30

      - label: "Summary"
        name: "summary"
        widget: "text"

      - label: "Feature Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Body"
        name: "body"
        widget: "markdown"

      - label: "Draft (hide from the Education page)"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "Keep on while an article is awaiting compliance review. Turn off and publish to list it on the Education page."

  - name: "reviews"
    label: "Customer Reviews"
    label_singular: "Review"
    folder: "_reviews"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{name}}"
    summary: "{{rating}}★ · {{name}} · {{date}}"
    fields:
      - label: "Customer first name"
        name: "name"
        widget: "string"
        hint: "First name and initial only, e.g. Sarah K. Only publish reviews where the customer ticked the box to agree."
      - label: "Star rating"
        name: "rating"
        widget: "select"
        default: "5"
        options:
          - { label: "★★★★★  5 stars", value: "5" }
          - { label: "★★★★☆  4 stars", value: "4" }
          - { label: "★★★☆☆  3 stars", value: "3" }
          - { label: "★★☆☆☆  2 stars", value: "2" }
          - { label: "★☆☆☆☆  1 star", value: "1" }
        hint: "Publish every genuine review, including lower ratings. UK law does not allow hiding negative reviews."
      - label: "Review date"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false
      - label: "Review"
        name: "body"
        widget: "text"
        hint: "Paste the customer's words exactly. You can fix obvious typos but don't change the meaning."
